<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MailCase - Inbox</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
 tailwind.config = {
 darkMode: "class",
 theme: { extend: { colors: {} } }
 }
 </script>
<style>
 body { font-family: 'Inter', sans-serif; background-color: #0f172a; min-height: 100dvh; }
 .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
 .icon-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
 ::-webkit-scrollbar { display: none; }
 .hidden-view { display: none !important; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 pb-24">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-4 h-14 w-full z-40 bg-slate-900 border-b border-slate-800 sticky top-0">
  <button class="p-2 rounded-full hover:bg-slate-800 text-slate-400 transition-colors">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <h1 class="text-xl font-bold text-white tracking-wide" id="header-title">Home</h1>
  <div class="flex items-center gap-2">
    <button onclick="document.getElementById('form-container').classList.toggle('hidden-view')" class="p-2 rounded-full hover:bg-slate-800 text-slate-400 transition-colors">
      <span class="material-symbols-outlined">add</span>
    </button>
    <div class="w-8 h-8 rounded-full overflow-hidden bg-slate-800 border border-slate-700">
      <img alt="User" class="w-full h-full object-cover" src="https://ui-avatars.com/api/?name=Ricardo+Carmona&background=0f172a&color=fff"/>
    </div>
  </div>
</header>

<main class="p-4 flex flex-col gap-6 max-w-3xl mx-auto w-full">
  
  <!-- Add Case Form -->
  <div id="form-container" class="hidden-view bg-slate-800 rounded-xl p-4 shadow-md border border-slate-700">
    <h2 class="text-sm font-semibold mb-3 text-cyan-400">NUEVO CASO MANUAL</h2>
    <form id="case-form" class="flex flex-col gap-3">
      <input name="title" class="bg-slate-900 p-2 rounded border border-slate-700 text-slate-100" placeholder="Título" required />
      <input name="source" class="bg-slate-900 p-2 rounded border border-slate-700 text-slate-100" placeholder="Origen" />
      <textarea name="description" class="bg-slate-900 p-2 rounded border border-slate-700 text-slate-100 h-20" placeholder="Notas"></textarea>
      <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white py-2 rounded-lg font-bold mt-2">Guardar</button>
    </form>
  </div>

  <!-- VIEWS CONTAINER -->
  <div id="views">
    <!-- VIEW: HOME (Urgentes, Importantes, Not Sure) -->
    <div id="view-home" class="flex flex-col gap-6">
      <section id="section-urgente">
        <h2 class="text-sm text-rose-500 uppercase tracking-wider flex items-center gap-2 mb-2 border-b border-slate-800 pb-2">
          <span class="w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]"></span> URGENTES
        </h2>
        <div class="list-container flex flex-col gap-2"></div>
      </section>
      
      <section id="section-importante">
        <h2 class="text-sm text-cyan-400 uppercase tracking-wider flex items-center gap-2 mb-2 border-b border-slate-800 pb-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.6)]"></span> IMPORTANTES
        </h2>
        <div class="list-container flex flex-col gap-2"></div>
      </section>
      
      <section id="section-notsure">
        <h2 class="text-sm text-slate-400 uppercase tracking-wider flex items-center gap-2 mb-2 border-b border-slate-800 pb-2">
          <span class="w-2 h-2 rounded-full bg-slate-500"></span> NOT SURE
        </h2>
        <div class="list-container flex flex-col gap-2 opacity-80"></div>
      </section>
    </div>

    <!-- VIEW: CORREOS POR ENVIAR -->
    <div id="view-porenviar" class="hidden-view flex flex-col gap-6">
      <section id="section-porenviar">
        <h2 class="text-sm text-indigo-400 uppercase tracking-wider flex items-center gap-2 mb-2 border-b border-slate-800 pb-2">
          <span class="material-symbols-outlined text-[18px]">send</span> CORREOS POR ENVIAR
        </h2>
        <div class="list-container flex flex-col gap-2"></div>
      </section>
    </div>

    <!-- VIEW: EVENTOS -->
    <div id="view-evento" class="hidden-view flex flex-col gap-6">
      <section id="section-evento">
        <h2 class="text-sm text-emerald-400 uppercase tracking-wider flex items-center gap-2 mb-2 border-b border-slate-800 pb-2">
          <span class="material-symbols-outlined text-[18px]">event</span> EVENTOS / AGENDA
        </h2>
        <div class="list-container flex flex-col gap-2"></div>
      </section>
    </div>

    <!-- VIEW: SEGUIMIENTO -->
    <div id="view-seguimiento" class="hidden-view flex flex-col gap-6">
      <section id="section-seguimiento">
        <h2 class="text-sm text-amber-400 uppercase tracking-wider flex items-center gap-2 mb-2 border-b border-slate-800 pb-2">
          <span class="material-symbols-outlined text-[18px]">visibility</span> SEGUIMIENTO / UNANSWERED
        </h2>
        <div class="list-container flex flex-col gap-2"></div>
      </section>
    </div>

    <!-- VIEW: ARCHIVADOS -->
    <div id="view-archivado" class="hidden-view flex flex-col gap-6">
      <section id="section-archivado">
        <h2 class="text-sm text-slate-500 uppercase tracking-wider flex items-center gap-2 mb-2 border-b border-slate-800 pb-2">
          <span class="material-symbols-outlined text-[18px]">archive</span> ARCHIVADOS
        </h2>
        <div class="list-container flex flex-col gap-2 opacity-60"></div>
      </section>
    </div>
  </div>
</main>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-2 py-2 bg-slate-900 border-t border-slate-800">
  <button onclick="switchView('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center text-cyan-400 w-16 py-1 rounded-xl transition-all">
    <span class="material-symbols-outlined icon-fill">home</span>
    <span class="text-[10px] mt-1">Home</span>
  </button>
  <button onclick="switchView('porenviar')" id="nav-porenviar" class="nav-btn flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 w-16 py-1 rounded-xl transition-all">
    <span class="material-symbols-outlined">send</span>
    <span class="text-[10px] mt-1">Enviar</span>
  </button>
  <button onclick="switchView('evento')" id="nav-evento" class="nav-btn flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 w-16 py-1 rounded-xl transition-all">
    <span class="material-symbols-outlined">event</span>
    <span class="text-[10px] mt-1">Eventos</span>
  </button>
  <button onclick="switchView('seguimiento')" id="nav-seguimiento" class="nav-btn flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 w-16 py-1 rounded-xl transition-all">
    <span class="material-symbols-outlined">visibility</span>
    <span class="text-[10px] mt-1">Follow-up</span>
  </button>
  <button onclick="switchView('archivado')" id="nav-archivado" class="nav-btn flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 w-16 py-1 rounded-xl transition-all">
    <span class="material-symbols-outlined">archive</span>
    <span class="text-[10px] mt-1">Archivo</span>
  </button>
</nav>

<!-- Modal for Due Date Selection -->
<div id="date-modal" class="hidden-view fixed inset-0 bg-slate-950/80 z-[100] flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 w-full max-w-sm shadow-2xl">
    <h3 class="text-lg font-bold text-white mb-1" id="modal-title">Programar</h3>
    <p class="text-sm text-slate-400 mb-4" id="modal-desc">Elige cuándo agendar esto.</p>
    
    <div class="flex flex-col gap-2">
      <button onclick="submitModal('hoy')" class="bg-slate-700 hover:bg-slate-600 text-left px-4 py-3 rounded-lg text-slate-200 font-medium">Hoy por la tarde</button>
      <button onclick="submitModal('manana')" class="bg-slate-700 hover:bg-slate-600 text-left px-4 py-3 rounded-lg text-slate-200 font-medium">Mañana</button>
      <button onclick="submitModal('semana')" class="bg-slate-700 hover:bg-slate-600 text-left px-4 py-3 rounded-lg text-slate-200 font-medium">Próxima semana</button>
      <div class="bg-slate-700 rounded-lg flex items-center px-2 mt-1 border border-slate-600">
        <input type="datetime-local" id="custom-date" class="bg-transparent border-none text-slate-200 w-full focus:ring-0 text-sm py-3" />
        <button onclick="submitModal('custom')" class="text-cyan-400 font-bold px-3">OK</button>
      </div>
    </div>
    <div class="mt-4 flex justify-end">
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 text-sm font-medium px-4 py-2">Cancelar</button>
    </div>
  </div>
</div>

<script src="/app.js" type="module"></script>
</body></html>
